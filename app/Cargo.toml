[package]
name = "readwise-app"
version = "0.1.0"
edition = "2021"

[package.metadata.packager]
product_name = "ReadWise"
identifier = "org.ohmycloud.readwise"

[package.metadata.makepad.android]
version_code = 2
min_sdk_version = 26

[dependencies]
makepad-ai = { git = "https://github.com/makepad/makepad", branch = "dev" }
makepad-code-editor = { git = "https://github.com/makepad/makepad", branch = "dev" }
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
readwise-core = { path = "../core" }
readwise-math = { path = "../math" }
jieba-rs = "0.10"
unicode-segmentation = "1"
log = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
makepad-android-state = "0.1.0"
makepad-jni-sys = "0.4.0"
