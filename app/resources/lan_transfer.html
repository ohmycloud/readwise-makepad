<!doctype html>
<html lang="__LANG__">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadWise</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#292c28;font:16px/1.65 system-ui,sans-serif}main{max-width:640px;margin:8vh auto;padding:28px}small{color:#697165;letter-spacing:.08em}h1{font-size:30px;margin:14px 0}p{color:#697165}.card{background:white;border:1px solid #dedfd6;border-radius:18px;padding:24px;margin:28px 0}.picker{display:block;border:1px dashed #9aa992;border-radius:12px;padding:24px;text-align:center;cursor:pointer;color:#42603e}.picker input{display:block;width:100%;margin-top:14px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:20px;background:#466541;color:white;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:default}progress{width:100%;accent-color:#466541}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #e4e6df;overflow-wrap:anywhere}.error{color:#a34436}.ok{color:#42603e}#status{white-space:pre-line}footer{font-size:13px;color:#697165}@media(max-width:420px){main{margin:20px auto;padding:20px}.card{padding:18px}h1{font-size:26px}}
</style>
<main>
<small>READWISE</small><h1 id="title"></h1><p id="intro"></p>
<div class="card"><label class="picker"><span id="choose"></span><input id="files" type="file" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple></label><button id="send" disabled></button><p id="status" role="status" aria-live="polite"></p><progress id="progress" max="100" value="0" hidden></progress><ul id="results"></ul></div>
<footer id="footer"></footer>
</main>
<script>
const en=document.documentElement.lang==='en';
const t=en?{title:'Transfer books over Wi-Fi',intro:'Choose EPUB or PDF files to add them to your phone’s bookshelf.',choose:'Choose EPUB / PDF files · up to 200 MB each',send:'Upload to ReadWise',footer:'Keep both devices on the same Wi-Fi. Receiving continues when the transfer screen is closed or ReadWise is in the background. Stop receiving in ReadWise to disable this link, or wait for its 30-minute expiry.',empty:'Choose at least one EPUB or PDF file.',invalid:'Only EPUB and PDF files up to 200 MB are supported.',sending:'Uploading',importing:'Upload complete. Importing…',ok:'Added',error:'Failed',done:'Finished',connection:'Connection interrupted. Check Wi-Fi or start a new transfer session.'}:{title:'局域网传书',intro:'选择 EPUB 或 PDF 文件，直接添加到手机的书架。',choose:'选择 EPUB / PDF 文件 · 每本最大 200 MB',send:'开始传书',footer:'请保持两台设备连接同一 Wi-Fi。关闭手机传书界面或切到后台仍可接收；点击“停止接收”或 30 分钟后，此网址失效。',empty:'请先选择 EPUB 或 PDF 文件。',invalid:'仅支持 EPUB 和 PDF 文件，每本最大 200 MB。',sending:'正在上传',importing:'上传完成，正在导入…',ok:'已加入书架',error:'失败',done:'传书完成',connection:'连接中断，请检查 Wi-Fi，或在手机上重新开启传书。'};
for(const id of ['title','intro','choose','send','footer'])document.getElementById(id).textContent=t[id];
const input=document.getElementById('files'),button=document.getElementById('send'),status=document.getElementById('status'),progress=document.getElementById('progress'),results=document.getElementById('results');
input.onchange=()=>{button.disabled=!input.files.length;status.textContent='';};
function upload(file){return new Promise((resolve,reject)=>{
const xhr=new XMLHttpRequest();
xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=e.loaded/e.total*100;};
xhr.upload.onload=()=>{status.textContent=t.importing;};
xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText);}catch{reject(new Error(t.connection));return;}if(xhr.status===201&&data.ok)resolve(data.message);else reject(new Error(data.message||t.error));};
xhr.onerror=xhr.ontimeout=xhr.onabort=()=>reject(new Error(t.connection));
xhr.open('POST',location.pathname.replace(/\/$/,'')+'/upload?name='+encodeURIComponent(file.name));
xhr.timeout=10*60*1000;xhr.setRequestHeader('Content-Type',/\.pdf$/i.test(file.name)?'application/pdf':'application/epub+zip');xhr.send(file);
});}
button.onclick=async()=>{
const files=Array.from(input.files);if(!files.length){status.textContent=t.empty;return;}
button.disabled=true;input.disabled=true;results.replaceChildren();progress.hidden=false;
let added=0,failed=0;
try{for(let i=0;i<files.length;i++){
const file=files[i],row=document.createElement('li');results.appendChild(row);progress.value=0;
status.textContent=`${t.sending} ${i+1}/${files.length}\n${file.name}`;
try{if(!/\.(epub|pdf)$/i.test(file.name)||file.size===0||file.size>200*1024*1024)throw new Error(t.invalid);
const title=await upload(file);row.className='ok';row.textContent=`${t.ok} · ${title}`;added++;
}catch(e){row.className='error';row.textContent=`${file.name} · ${e.message}`;failed++;}
}status.textContent=`${t.done} · ${t.ok} ${added} · ${t.error} ${failed}`;
}finally{progress.hidden=true;input.disabled=false;button.disabled=false;}
};
</script>
</html>
