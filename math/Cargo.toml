[package]
name = "readwise-math"
version = "0.1.0"
edition = "2024"

[dependencies]
# One offline compiler/projection for native and Web readers.
typst = "=0.15.1"
typst-svg = "=0.15.1"
typst-layout = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["legacy-crypto"] }
ammonia = "4.2"
html-escape = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
# Bounded visual fallback for diagram-dominated PDF pages, not text extraction.
hayro = "=0.7.1"
base64 = "0.22"

[dev-dependencies]
readwise-core = { path = "../core" }
